name: Build, test & release

# Every push to main: analyze + test, then (only if that passes) build the
# web bundle and the Android APK, bump the patch version, prepend a
# changelog entry generated from the commits since the last tag, and
# publish it all as a GitHub Release with both artifacts attached.
on:
  push:
    branches: [main]
    # Doc-only commits (roadmap, readme, changelog, ...) don't need a build
    # or a release - only trigger when something in these paths also
    # changes. Ignored if the commit touches nothing else.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: {} # allows a manual "Run workflow" trigger, e.g. for testing

# A second push to main while one release is still running would race it
# for the same next version number - queue them instead of running in
# parallel, but don't cancel a release that's already in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Belt and suspenders: GitHub already skips runs whose triggering commit
    # message contains "[skip ci]" (used below on the bot's own version-bump
    # commit, to avoid it re-triggering this same workflow forever) - this
    # condition is a second, explicit guard for the same thing.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed for the changelog and version bump

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;28.0.3" "build-tools;34.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compute next version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Last tag: $LAST_TAG -> new version: $NEW_VERSION"
          {
            echo "new_version=$NEW_VERSION"
            echo "last_tag=$LAST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry body
        id: changelog
        run: |
          LAST_TAG="${{ steps.version.outputs.last_tag }}"
          RANGE=""
          if [ "$LAST_TAG" != "v0.0.0" ]; then
            RANGE="$LAST_TAG..HEAD"
          fi
          BODY=$(git log $RANGE --pretty=format:'- %s' --no-merges)
          if [ -z "$BODY" ]; then
            BODY="- Aucun changement notable (build de maintenance)."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build web
        run: >
          flutter build web --release
          --build-name=${{ steps.version.outputs.new_version }}
          --build-number=${{ github.run_number }}

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.new_version }}
          --build-number=${{ github.run_number }}

      - name: Package web build
        run: |
          cd build/web
          zip -r "../../money-manager-web.zip" .

      - name: Commit version bump, tag and push
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ steps.version.outputs.new_version }}"

          # Two runs finishing close together can't just be rebased past
          # each other if they both touched pubspec.yaml/CHANGELOG.md -
          # that's a real content conflict, not just "history moved".
          # Instead, each attempt starts over from whatever is actually on
          # origin/main right now (picking up any release that landed
          # meanwhile) and reapplies the edits fresh - bumping the version
          # again first if it turns out another run already claimed it.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null \
                || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION already released, bumping patch (attempt $attempt)"
              IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
              VERSION="$MAJ.$MIN.$((PAT + 1))"
              continue
            fi

            sed -i "s/^version: .*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml
            TMP_CHANGELOG=$(mktemp)
            {
              echo "# Changelog"
              echo ""
              echo "Toutes les modifications notables de ce projet sont consignées ici."
              echo "Format inspiré de [Keep a Changelog](https://keepachangelog.com/fr/1.0.0/)."
              echo ""
              echo "## [$VERSION] - $(date +%Y-%m-%d)"
              echo ""
              echo "${{ steps.changelog.outputs.body }}"
              echo ""
              # Keep only the previous entries (from the first "## ["
              # heading onward) - a plain tail would also re-copy the
              # intro paragraph above, duplicating it on every release.
              awk '/^## \[/{found=1} found' CHANGELOG.md
            } > "$TMP_CHANGELOG"
            mv "$TMP_CHANGELOG" CHANGELOG.md

            git add pubspec.yaml CHANGELOG.md
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git tag -a "v${VERSION}" -m "Version ${VERSION}"

            if git push origin main && git push origin "v${VERSION}"; then
              echo "final_version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying from a fresh base..."
            git tag -d "v${VERSION}" || true
          done
          echo "Ran out of retries trying to publish a release." >&2
          exit 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.publish.outputs.final_version }}
          name: ${{ steps.publish.outputs.final_version }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            money-manager-web.zip
