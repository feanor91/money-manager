name: Build, test & release

# Every push to main: analyze + test, then (only if that passes) build the
# web bundle and the Android APK, bump the patch version, prepend a
# changelog entry generated from the commits since the last tag, and
# publish it all as a GitHub Release with both artifacts attached.
on:
  push:
    branches: [main]
    # Doc-only or CI-config-only commits (roadmap, readme, changelog, a
    # workflow file tweak...) don't need a build or a release - only
    # trigger when something in these paths also changes. Ignored if the
    # commit touches nothing else.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch: {} # allows a manual "Run workflow" trigger, e.g. for testing

# A second push to main while one release is still running would race it
# for the same next version number - queue them instead of running in
# parallel, but don't cancel a release that's already in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Belt and suspenders: GitHub already skips runs whose triggering commit
    # message contains "[skip ci]" (used below on the bot's own version-bump
    # commit, to avoid it re-triggering this same workflow forever) - this
    # condition is a second, explicit guard for the same thing.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      final_version: ${{ steps.publish.outputs.final_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed for the changelog and version bump

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;28.0.3" "build-tools;34.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compute next version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Last tag: $LAST_TAG -> new version: $NEW_VERSION"
          {
            echo "new_version=$NEW_VERSION"
            echo "last_tag=$LAST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry body
        id: changelog
        run: |
          LAST_TAG="${{ steps.version.outputs.last_tag }}"
          RANGE=""
          if [ "$LAST_TAG" != "v0.0.0" ]; then
            RANGE="$LAST_TAG..HEAD"
          fi
          BODY=$(git log $RANGE --pretty=format:'- %s' --no-merges)
          if [ -z "$BODY" ]; then
            BODY="- Aucun changement notable (build de maintenance)."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build web
        run: >
          flutter build web --release
          --build-name=${{ steps.version.outputs.new_version }}
          --build-number=${{ github.run_number }}

      - name: Set up Android release signing
        # Without this, every CI run signs with a fresh random debug key
        # (auto-generated per runner) - Android then refuses to install
        # a new release as an "update" over the previous one, since the
        # signatures don't match, forcing a full uninstall every time.
        # See android/app/build.gradle.kts for how key.properties is used.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release.keystore.jks
          PROPS

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.new_version }}
          --build-number=${{ github.run_number }}

      - name: Package web build
        run: |
          cd build/web
          zip -r "../../money-manager-web.zip" .

      - name: Commit version bump, tag and push
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ steps.version.outputs.new_version }}"

          # Two runs finishing close together can't just be rebased past
          # each other if they both touched pubspec.yaml/CHANGELOG.md -
          # that's a real content conflict, not just "history moved".
          # Instead, each attempt starts over from whatever is actually on
          # origin/main right now (picking up any release that landed
          # meanwhile) and reapplies the edits fresh - bumping the version
          # again first if it turns out another run already claimed it.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null \
                || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION already released, bumping patch (attempt $attempt)"
              IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
              VERSION="$MAJ.$MIN.$((PAT + 1))"
              continue
            fi

            sed -i "s/^version: .*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml
            TMP_CHANGELOG=$(mktemp)
            {
              echo "# Changelog"
              echo ""
              echo "Toutes les modifications notables de ce projet sont consignées ici."
              echo "Format inspiré de [Keep a Changelog](https://keepachangelog.com/fr/1.0.0/)."
              echo ""
              echo "## [$VERSION] - $(date +%Y-%m-%d)"
              echo ""
              echo "${{ steps.changelog.outputs.body }}"
              echo ""
              # Keep only the previous entries (from the first "## ["
              # heading onward) - a plain tail would also re-copy the
              # intro paragraph above, duplicating it on every release.
              awk '/^## \[/{found=1} found' CHANGELOG.md
            } > "$TMP_CHANGELOG"
            mv "$TMP_CHANGELOG" CHANGELOG.md

            git add pubspec.yaml CHANGELOG.md
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git tag -a "v${VERSION}" -m "Version ${VERSION}"

            if git push origin main && git push origin "v${VERSION}"; then
              echo "final_version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying from a fresh base..."
            git tag -d "v${VERSION}" || true
          done
          echo "Ran out of retries trying to publish a release." >&2
          exit 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.publish.outputs.final_version }}
          name: ${{ steps.publish.outputs.final_version }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            money-manager-web.zip

  # Separate job because a Flutter Windows build genuinely needs a Windows
  # runner - can't happen on the ubuntu-latest box the rest of this
  # workflow uses. Runs after `release` (needs the version number/tag it
  # just published) and attaches its own artifacts to that same release
  # afterwards, rather than creating a second one.
  build-windows:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.final_version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable build
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.final_version }}"
          $releaseDir = "build\windows\x64\runner\Release"
          $portableDir = "dist\portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "$releaseDir\*" $portableDir -Recurse
          Set-Content -Path "$portableDir\portable.txt" -Encoding utf8 -Value @"
          Ce fichier indique a Money Manager de stocker ses preferences (code PIN, dernier fichier ouvert, theme...) dans un fichier local chiffre a cote de cet executable, plutot que dans le profil Windows - ce dossier reste ainsi vraiment portable (fonctionne pareil sur n'importe quel PC / cle USB).

          Ne supprimez pas ce fichier.
          "@
          Compress-Archive -Path "$portableDir\*" -DestinationPath "dist\MoneyManager-$version-portable-win64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.final_version }}"
          (Get-Content installer\money_manager.iss) `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" |
            Set-Content installer\money_manager.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\money_manager.iss

      - name: Attach Windows artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.final_version }}
          files: |
            dist/MoneyManager-${{ needs.release.outputs.final_version }}-portable-win64.zip
            dist/MoneyManager-${{ needs.release.outputs.final_version }}-setup-win64.exe
