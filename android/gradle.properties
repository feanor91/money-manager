org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a Windows-specific "Could not close incremental caches"
# Kotlin/Gradle build-tools-API bug hit while verifying the Android SAF
# file-access fix (2026-08-01) - full (non-incremental) Kotlin compiles
# are slower but don't hit this. Safe to remove if a Kotlin/Gradle/AGP
# update fixes the underlying bug and incremental compiles work again.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
