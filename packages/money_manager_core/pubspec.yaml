name: money_manager_core
description: >
  Coeur métier pur Dart de Money Manager (modèles + accès SQLite MMEX) -
  partagé entre l'appli Flutter et le futur serveur API. Aucune dépendance
  Flutter ici, volontairement (voir PLAN_ARCHITECTURE_CLIENT_SERVEUR.md,
  étape 1) : ce paquet doit rester utilisable depuis un exécutable Dart
  pur, pas seulement depuis Flutter.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  intl: ^0.20.2
  json_annotation: ^4.12.0
  sqlite3: ^2.4.6
  typed_data: ^1.3.2

dev_dependencies:
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  lints: ^4.0.0
  test: ^1.25.0
