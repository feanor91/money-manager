name: money_manager
description: Gestion de budget personnelle basee sur une base MoneyManager Ex (.mmb), web + Android.
publish_to: 'none'
version: 1.0.94+106

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Acces base SQLite (le fichier .mmb est une base SQLite standard)
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24 # bundle la lib native sqlite3 pour Android/desktop
  typed_data: ^1.3.2 # seed du VFS in-memory de sqlite3 sur web

  # Choix de l'emplacement du fichier .mmb
  file_picker: ^11.0.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Etat / navigation
  provider: ^6.1.2

  # Charts (previsions budget)
  fl_chart: ^0.69.0

  # Formats dates / devises
  intl: ^0.20.2

  # Persistance du chemin de la base choisie
  shared_preferences: ^2.3.3

  # Hash du code PIN de verrouillage (jamais stocke en clair)
  crypto: ^3.0.3

  # Acces persistant/ecriture au fichier sur web (File System Access API)
  web: ^1.1.0

  cupertino_icons: ^1.0.8
  encrypt: ^5.0.3
  package_info_plus: ^9.0.1
  saf_util: ^3.1.0
  saf_stream: ^4.0.1
  http: ^1.6.0
  flutter_local_notifications: ^22.2.0

  # Saisie vocale de transactions (Android uniquement) - reconnaissance via
  # les APIs natives du telephone (SpeechRecognizer), pas d'appel API externe.
  speech_to_text: ^7.4.0

  # IA locale (Windows uniquement, optionnelle) - voir
  # lib/services/nl_query/local_llm/. N'utilise plus llama_cpp_dart depuis
  # le 2026-08-03 (aucun binaire Windows pret a l'emploi, voir ROADMAP.md) -
  # parle desormais en HTTP a un llama-server.exe lance en sous-processus,
  # via le paquet http ci-dessus.
  markdown: ^7.3.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # In-memory shared_preferences backend for widget tests that reach
  # AppPreferences.getInstance() - see nl_query_dialog_test.dart.
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/mmex_blank_schema.sql
